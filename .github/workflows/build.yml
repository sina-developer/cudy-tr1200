# SPDX-License-Identifier: Apache-2.0
# Builds luci-app-deck and luci-theme-deck with the official OpenWrt SDK.
# Both packages are architecture-independent ("all"), so one SDK per
# OpenWrt release is enough: 24.10 produces .ipk (opkg), 25.12 produces .apk.
name: Build packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ '24.10.4', '25.12.6' ]
    steps:
      - uses: actions/checkout@v4

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: x86_64-${{ matrix.release }}
          FEEDNAME: deck
          PACKAGES: luci-app-deck luci-theme-deck
          NO_REFRESH_CHECK: true
          V: s

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin -type f \( -name 'luci-app-deck*' -o -name 'luci-theme-deck*' \) -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: deck-openwrt-${{ matrix.release }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
